<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — TokoKu</title>
  <link rel="stylesheet" href="./css/login.css" />
</head>
<body class="admin-login-page">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-brand">🛍️ TokoKu</h1>
        <p class="login-subtitle">Panel Admin</p>
      </div>

      <!-- FORM LOGIN -->
      <form method="POST" action="/admin/login" class="login-form">
        
        <!-- CSRF Token (nanti di-generate PHP) -->
        <input type="hidden" name="csrf_token" value="MOCK_CSRF_TOKEN_12345" />

        <!-- Error Message (jika ada) -->
        <!-- Contoh: PHP render ini jika login gagal -->
        <div class="alert alert-danger">
          Email atau password salah. Silakan coba lagi.
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="admin@tokoku.com"
            required
            autocomplete="email"
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block">
          Masuk
        </button>

      </form>

      <div class="login-footer">
        <p class="text-muted text-center" style="font-size: 0.85rem;">
          © 2026 TokoKu. Akses terbatas untuk admin.
        </p>
      </div>
    </div>
  </div>

</body>
</html>
