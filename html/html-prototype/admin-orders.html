<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Order — TokoKu</title>
  <link rel="stylesheet" href="./css/admin.css" />
</head>
<body>

  <div id="app"></div>

  <script type="module">
    import { HTMP } from 'https://cdn.jsdelivr.net/npm/htm-projection@v1.2.2/+esm';

    // ==========================================
    // P1: PATTERN (Template)
    // ==========================================
    const adminLayout = (content) => `
      <div class="admin-layout">
        <header class="admin-topbar">
          <div class="topbar-left">
            <button class="sidebar-toggle" @click="toggleSidebar">&nbsp;≡&nbsp;</button>
            <div class="topbar-brand">
              <span class="topbar-logo">🛍️</span>
              <span class="topbar-title">TokoKu</span>
            </div>
          </div>
          <div class="topbar-right">
            <div class="topbar-user">
              <span class="topbar-user-name">Admin</span>
              <span class="topbar-user-role">Owner</span>
            </div>
          </div>
        </header>
        
        <!-- Sidebar dengan Class Merging v1.2.2 -->
        <aside class="admin-sidebar" :class="sidebarOpen ? 'is-open' : ''">
          <div class="sidebar-overlay" :class="sidebarOpen ? 'is-visible' : ''" @click="closeSidebar"></div>
          <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="sidebar-link" :class="currentPage === 'dashboard' ? 'is-active' : ''">📊 Dashboard</a>
            <a href="/admin/products" class="sidebar-link" :class="currentPage === 'products' ? 'is-active' : ''">📦 Produk</a>
            <a href="/admin/categories" class="sidebar-link" :class="currentPage === 'categories' ? 'is-active' : ''">🏷️ Kategori</a>
            <a href="/admin/orders" class="sidebar-link" :class="currentPage === 'orders' ? 'is-active' : ''">🛒 Order</a>
            <a href="/admin/logout" class="sidebar-link sidebar-link-danger">🚪Logout</a>
          </nav>
        </aside>

        <main class="admin-content">
          ${content}
        </main>
      </div>
    `;


    const patterns = {
      orders: adminLayout(`
        <div class="content-header">
          <h1 class="content-title">Daftar Order</h1>
          <p class="content-subtitle">Pantau dan kelola transaksi pelanggan</p>
        </div>

        <!-- TOOLBAR: HYBRID FILTERING -->
        <div class="card mb-3" style="display:flex; gap:1rem; flex-wrap:wrap; align-items:center;">
          
          <!-- 1. Search (Client-side) -->
          <input 
            type="text" 
            class="form-input" 
            placeholder="Cari No. Invoice atau Nama..." 
            :value="search_query" 
            @input="updateProxy(e, 'search_query')" 
            style="flex:1; min-width:200px;"
          >

          <!-- 2. Filter Bulan (Server-side trigger) -->
          <input 
            type="month" 
            class="form-input" 
            :value="filter_month" 
            @change="fetchOrdersByMonth" 
            style="max-width:180px;"
          >

          <!-- 3. Filter Status (Client-side) -->
          <select 
            class="form-select" 
            :value="filter_status" 
            @change="updateProxy(e, 'filter_status')" 
            style="max-width:150px;"
          >
            <option value="all">Semua Status</option>
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>

          <!-- Tombol Refresh (Opsional, untuk trigger manual fetch) -->
          <button class="btn btn-primary" @click="fetchOrdersByMonth" :disabled="isFetching">
            <span>{{ isFetching ? 'Memuat...' : '🔄 Tarik Data' }}</span>
          </button>
        </div>

        <!-- TABLE LIST -->
        <section class="card">
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>No. Invoice</th>
                  <th>Pelanggan</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th>Tanggal</th>
                  <th style="width: 100px;">Aksi</th>
                </tr>
              </thead>
              <tbody>
                <tr :for="order in paged">
                  <td><a :href="'/admin/orders/' + order.id" style="font-weight:600; color:#2563eb;">{{ order.invoice }}</a></td>
                  <td>{{ order.customer }}</td>
                  <td>Rp <span>{{ formatRupiah(order.total) }}</span></td>
                  <td>
                    <span class="badge" :class="getBadgeClass(order.status)">
                      {{ order.status }}
                    </span>
                  </td>
                  <td>{{ order.date }}</td>
                  <td>
                    <a :href="'/admin/orders/' + order.id" class="btn btn-sm btn-secondary">Detail</a>
                  </td>
                </tr>
                
                <!-- Empty State -->
                <tr>
                  <td colspan="6" style="text-align:center; padding:2rem; color:#6b7280;" :style="paged.length === 0 ? '' : 'display:none;'">
                    Tidak ada order yang ditemukan.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- PAGINATION CONTROLS -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1.5rem; flex-wrap:wrap; gap:1rem;">
            <div class="text-muted" style="font-size:0.9rem;">
              Menampilkan <span>{{ paged.length }}</span> dari <span>{{ filtered.length }}</span> data 
              (Halaman <span>{{ current_page }}</span> dari <span>{{ total_pages }}</span>)
            </div>
            
            <div style="display:flex; gap:0.5rem; align-items:center;">
              <button class="btn btn-sm" :class="current_page === 1 ? 'btn-secondary' : 'btn-primary'" :disabled="current_page === 1" @click="prevPage">Prev</button>
              <button class="btn btn-sm" :for="p in page_numbers" :class="p === current_page ? 'btn-primary' : 'btn-secondary'" @click="changePage(p)" :disabled="p === '...'" style="min-width: 36px;">{{ p }}</button>
              <button class="btn btn-sm" :class="current_page === total_pages ? 'btn-secondary' : 'btn-primary'" :disabled="current_page === total_pages" @click="nextPage">Next</button>
            </div>
          </div>
        </section>
      `)
    };

    // ==========================================
    // P2: PROXY (State & Helpers)
    // ==========================================
    const proxy = {
      currentPage: 'orders',
      sidebarOpen: false,
      
      // Filter States
      search_query: '',
      filter_status: 'all',
      filter_month: '2026-10', // Default bulan ini
      isFetching: false, // Loading state untuk simulasi server
      
      // Pagination States
      filtered: [],
      paged: [],
      page_numbers: [],
      current_page: 1,
      per_page: 15,
      total_pages: 1,

      orders: [],

      // Helpers
      formatRupiah: (val) => val.toLocaleString('id-ID'),
      getBadgeClass: (status) => {
        const map = {
          'pending': 'badge-warning',
          'paid': 'badge-info',
          'shipped': 'badge-primary',
          'delivered': 'badge-success',
          'cancelled': 'badge-danger'
        };
        return map[status] || 'badge-muted';
      }
    };

    // ==========================================
    // P3: PROGRAM (Logic)
    // ==========================================
    const programs = {
      toggleSidebar: () => { app.proxy.sidebarOpen = !app.proxy.sidebarOpen; },
      closeSidebar: () => { app.proxy.sidebarOpen = false; },

      updateProxy: (e, name) => {
        app.proxy[name] = e.target.value;
        if (name === 'search_query' || name === 'filter_status') {
          app.programs.applyFilter();
        }
      },

      // --- SERVER-SIDE SIMULATION ---
      fetchOrdersByMonth: () => {
        app.proxy.isFetching = true;
        
        // Simulasi network delay (500ms)
        setTimeout(() => {
          // Di dunia nyata: fetch(`/api/orders?month=${app.proxy.filter_month}`)
          // Di sini kita generate 500 data dummy untuk bulan yang dipilih
          app.proxy.orders = generateMockOrders(app.proxy.filter_month, 500);
          
          app.proxy.isFetching = false;
          app.proxy.search_query = ''; // Reset search saat ganti bulan
          app.proxy.filter_status = 'all'; // Reset status saat ganti bulan
          app.programs.applyFilter();
        }, 500);
      },

      // --- CLIENT-SIDE FILTERING ---
      applyFilter: () => {
        const query = app.proxy.search_query.toLowerCase();
        const status = app.proxy.filter_status;

        app.proxy.filtered = app.proxy.orders.filter(o => {
          const matchSearch = o.invoice.toLowerCase().includes(query) || o.customer.toLowerCase().includes(query);
          const matchStatus = status === 'all' || o.status === status;
          return matchSearch && matchStatus;
        });

        app.proxy.current_page = 1;
        app.programs.applyPagination();
      },

      applyPagination: () => {
        const start = (app.proxy.current_page - 1) * app.proxy.per_page;
        const end = start + app.proxy.per_page;
        app.proxy.paged = app.proxy.filtered.slice(start, end);
        app.proxy.total_pages = Math.ceil(app.proxy.filtered.length / app.proxy.per_page) || 1;
        app.programs.updatePageNumbers();
      },

      updatePageNumbers: () => {
        const total = app.proxy.total_pages;
        const current = app.proxy.current_page;
        let pages = [];
        if (total <= 7) {
          for (let i = 1; i <= total; i++) pages.push(i);
        } else {
          pages.push(1);
          if (current > 3) pages.push('...');
          let start = Math.max(2, current - 1);
          let end = Math.min(total - 1, current + 1);
          for (let i = start; i <= end; i++) pages.push(i);
          if (current < total - 2) pages.push('...');
          pages.push(total);
        }
        app.proxy.page_numbers = pages;
      },

      prevPage: () => { app.programs.changePage(app.proxy.current_page - 1); },
      nextPage: () => { app.programs.changePage(app.proxy.current_page + 1); },
      
      changePage: (page) => {
        if (page < 1 || page > app.proxy.total_pages || page === '...') return;
        app.proxy.current_page = page;
        app.programs.applyPagination();
      }
    };

    // ==========================================
    // HELPER: Mock Data Generator (Simulasi Database)
    // ==========================================
    function generateMockOrders(month, count) {
      const statuses = ['pending', 'paid', 'shipped', 'delivered', 'cancelled'];
      const customers = ['Budi Santoso', 'Siti Aminah', 'Ahmad Rizki', 'Dewi Lestari', 'Eko Prasetyo', 'Rina Wulandari', 'Joko Anwar', 'Maya Sari'];
      const orders = [];
      
      for (let i = 1; i <= count; i++) {
        const day = String(Math.floor(Math.random() * 28) + 1).padStart(2, '0');
        orders.push({
          id: 10000 + i,
          invoice: `INV/${month.replace('-', '')}/${String(i).padStart(4, '0')}`,
          customer: customers[i % customers.length],
          total: 50000 + (i * 15000),
          status: statuses[i % statuses.length],
          date: `${day} ${month} 2026`
        });
      }
      return orders;
    }

    // ==========================================
    // INITIALIZATION & MOUNT
    // ==========================================
    const app = new HTMP('app', patterns.orders);
    app.setProxy(proxy);
    app.setProgram(programs);
    app.mount('app');

    // Trigger initial fetch
    app.programs.fetchOrdersByMonth();
    document.title = 'Daftar Order — TokoKu';
  </script>
</body>
</html>
