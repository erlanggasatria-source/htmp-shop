<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kategori — TokoKu</title>
  <link rel="stylesheet" href="./css/admin.css" />
</head>
<body>

  <!-- ============================================
       INITIAL DATA (JSON) - Simulasi dari Server
       ============================================ -->
  <script type="application/json" id="initial-data">
  {
    "categories": [
      { "id": 1, "name": "Sepatu", "slug": "sepatu", "parent_id": null, "parent_name": null },
      { "id": 2, "name": "Sepatu Pria", "slug": "sepatu-pria", "parent_id": 1, "parent_name": "Sepatu" },
      { "id": 3, "name": "Sepatu Wanita", "slug": "sepatu-wanita", "parent_id": 1, "parent_name": "Sepatu" },
      { "id": 4, "name": "Pakaian", "slug": "pakaian", "parent_id": null, "parent_name": null },
      { "id": 5, "name": "Aksesoris", "slug": "aksesoris", "parent_id": null, "parent_name": null }
    ]
  }
  </script>

  <div id="app"></div>

  <script type="module">
    import { HTMP } from 'https://cdn.jsdelivr.net/npm/htm-projection@v1.2.2/+esm';    

    // ==========================================
    // P1: PATTERN (Template)
    // ==========================================
    const adminLayout = (content) => `
      <div class="admin-layout">
        <header class="admin-topbar">
          <div class="topbar-left">
            <button class="sidebar-toggle" @click="toggleSidebar">&nbsp;≡&nbsp;</button>
            <div class="topbar-brand">
              <span class="topbar-logo">🛍️</span>
              <span class="topbar-title">TokoKu</span>
            </div>
          </div>
          <div class="topbar-right">
            <div class="topbar-user">
              <span class="topbar-user-name">Admin</span>
              <span class="topbar-user-role">Owner</span>
            </div>
          </div>
        </header>
        
        <!-- Sidebar dengan Class Merging v1.2.2 -->
        <aside class="admin-sidebar" :class="sidebarOpen ? 'is-open' : ''">
          <div class="sidebar-overlay" :class="sidebarOpen ? 'is-visible' : ''" @click="closeSidebar"></div>
          <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="sidebar-link" :class="currentPage === 'dashboard' ? 'is-active' : ''">📊 Dashboard</a>
            <a href="/admin/products" class="sidebar-link" :class="currentPage === 'products' ? 'is-active' : ''">📦 Produk</a>
            <a href="/admin/categories" class="sidebar-link" :class="currentPage === 'categories' ? 'is-active' : ''">🏷️ Kategori</a>
            <a href="/admin/orders" class="sidebar-link" :class="currentPage === 'orders' ? 'is-active' : ''">🛒 Order</a>
            <a href="/admin/logout" class="sidebar-link sidebar-link-danger">🚪Logout</a>
          </nav>
        </aside>

        <main class="admin-content">
          ${content}
        </main>
      </div>
    `;

    const patterns = {
      categories: adminLayout(`
        <div class="content-header">
          <h1 class="content-title">Kategori</h1>
          <p class="content-subtitle">Kelola kategori dan sub-kategori produk</p>
        </div>

        <!-- TOOLBAR -->
        <div class="card mb-3" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
          <input 
            type="text" 
            class="form-input" 
            placeholder="Cari kategori..." 
            :value="search_query" 
            @input="updateProxy(e, 'search_query')" 
            style="max-width:300px;"
          >
          <button class="btn btn-primary" @click="openModal">➕ Tambah Kategori</button>
        </div>

        <!-- TABLE LIST -->
        <section class="card">
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nama Kategori</th>
                  <th>Slug</th>
                  <th>Induk (Parent)</th>
                  <th style="width: 150px;">Aksi</th>
                </tr>
              </thead>
              <tbody>
                <!-- LOOP MENGGUNAKAN 'paged' (Data yang sudah difilter & dipaginasi) -->
                <tr :for="cat in paged">
                  <td>{{ cat.id }}</td>
                  <td style="font-weight:600;">{{ cat.name }}</td>
                  <td><code style="background:#f3f4f6; padding:2px 6px; border-radius:4px; font-size:0.85rem;">{{ cat.slug }}</code></td>
                  <td>{{ cat.parent_name || '-' }}</td>
                  <td>
                    <div style="display:flex; gap:0.5rem;">
                      <button class="btn btn-sm btn-secondary" @click="editModal(cat)">Edit</button>
                      <button class="btn btn-sm btn-danger" @click="deleteCategory(cat.id)">Hapus</button>
                    </div>
                  </td>
                </tr>
                <tr :if="paged.length === 0">
                  <td colspan="5" style="text-align:center; padding:2rem; color:#6b7280;">Tidak ada kategori ditemukan.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- PAGINATION CONTROLS -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1.5rem; flex-wrap:wrap; gap:1rem;">
            <div class="text-muted" style="font-size:0.9rem;">
              Menampilkan {{ paged.length }} dari {{ filtered.length }} data (Halaman {{ current_page }} dari {{ total_pages }})
            </div>
            
            <div style="display:flex; gap:0.5rem; align-items:center;">
                <!-- TOMBOL PREV -->
                <button 
                    :class="current_page === 1 ? 'btn btn-sm btn-secondary' : 'btn btn-sm btn-primary'"
                    :disabled="current_page === 1"
                    @click="prevPage"
                >Prev</button>          
                <!-- LOOP NOMOR HALAMAN -->                
                <button 
                    :for="p in page_numbers"
                    :class="p === current_page ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-secondary'"
                    @click="changePage(p)"
                    :disabled="p === '...'"
                    style="min-width: 36px;"
                >{{ p }}</button>                
                <!-- TOMBOL NEXT -->
                <button 
                    :class="current_page === total_pages ? 'btn btn-sm btn-secondary' : 'btn btn-sm btn-primary'"
                    :disabled="current_page === total_pages"
                    @click="nextPage"
                >Next</button>

              </div>              
          </div>
        </section>

        <!-- MODAL FORM (Create/Edit) - Sama seperti sebelumnya -->
        <div :style="isModalOpen ? 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem;' : 'display:none;'">
          <div style="background:#fff; border-radius:0.75rem; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:1.5rem; border-bottom:1px solid #e5e7eb;">
              <h2 style="font-size:1.25rem; font-weight:600; margin:0;">{{ isEditing ? 'Edit Kategori' : 'Tambah Kategori Baru' }}</h2>
              <button @click="closeModal" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#6b7280;">&times;</button>
            </div>
            <form @submit="saveCategory" style="padding:1.5rem; display:flex; flex-direction:column; gap:1rem;">
              <div style="display:flex; flex-direction:column; gap:0.5rem;">
                <label style="font-weight:600; font-size:0.9rem;">Nama Kategori <span style="color:#dc2626;">*</span></label>
                <input type="text" class="form-input" :value="form.name" @input="updateProxy(e, 'form.name')" placeholder="Contoh: Sepatu Pria" required>
              </div>
              <div style="display:flex; flex-direction:column; gap:0.5rem;">
                <label style="font-weight:600; font-size:0.9rem;">Slug (URL)</label>
                <input type="text" class="form-input" :value="form.slug" @input="updateProxy(e, 'form.slug')" placeholder="sepatu-pria" style="font-family:monospace;">
              </div>
              <div style="display:flex; flex-direction:column; gap:0.5rem;">
                <label style="font-weight:600; font-size:0.9rem;">Kategori Induk (Parent)</label>
                <select class="form-select" :value="form.parent_id" @change="updateProxy(e, 'form.parent_id')">
                  <option value="">-- Tidak Ada (Jadikan Kategori Utama) --</option>
                  <option :for="p in parentOptions" :value="p.id">{{ p.name }}</option>
                </select>
              </div>
              <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1rem; padding-top:1rem; border-top:1px solid #e5e7eb;">
                <button type="button" class="btn btn-secondary" @click="closeModal">Batal</button>
                <button type="submit" class="btn btn-primary">{{ isEditing ? '💾 Simpan Perubahan' : '➕ Buat Kategori' }}</button>
              </div>
            </form>
          </div>
        </div>
      `)
    };

    // ==========================================
    // P2: PROXY (State)
    // ==========================================
    const proxy = {
      currentPage: 'categories',
      sidebarOpen: false,
      
      // State Search & Pagination
      search_query: '',
      filtered: [],      // Lapisan 1: Hasil Search
      paged: [],         // Lapisan 2: Hasil Potong Halaman
      page_numbers: [],  // Array untuk loop tombol pagination [1, 2, 3, '...', 10]
      current_page: 1,
      per_page: 10,
      total_pages: 1,

      // State Modal & Form
      isModalOpen: false,
      isEditing: false,
      editingId: null,
      form: { name: '', slug: '', parent_id: '' },
      parentOptions: [],
      
      // Data Mentah dari Server
      categories: [] 
    };

    // ==========================================
    // P3: PROGRAM (Logic)
    // ==========================================
    const programs = {
      toggleSidebar: () => { app.proxy.sidebarOpen = !app.proxy.sidebarOpen; },
      closeSidebar: () => { app.proxy.sidebarOpen = false; },

      // --- LOGIC BERTINGKAT (BERLAPIS) ---
      
      // Lapisan 1: Filter
      applyFilter: () => {
        const query = app.proxy.search_query.toLowerCase();        
        if (!query) {
          app.proxy.filtered = app.proxy.categories;          
        } else {          
          app.proxy.filtered = app.proxy.filtered.filter(c => c.name.toLowerCase().includes(query));
        }
        // Setiap kali filter berubah, reset ke halaman 1
        app.proxy.current_page = 1;        
        app.programs.applyPagination();
      },

      // Lapisan 2: Pagination
      applyPagination: () => {
        const start = (app.proxy.current_page - 1) * app.proxy.per_page;
        const end = start + app.proxy.per_page;
        
        app.proxy.paged = [...app.proxy.filtered.slice(start, end)];
        app.proxy.total_pages = Math.ceil(app.proxy.filtered.length / app.proxy.per_page) || 1;
        
        app.programs.updatePageNumbers();
      },

      // Helper UI: Generate array nomor halaman
      updatePageNumbers: () => {
        const total = app.proxy.total_pages;
        const current = app.proxy.current_page;
        let pages = [];

        if (total <= 7) {
          for (let i = 1; i <= total; i++) pages.push(i);
        } else {
          pages.push(1);
          if (current > 3) pages.push('...');
          
          let start = Math.max(2, current - 1);
          let end = Math.min(total - 1, current + 1);
          
          for (let i = start; i <= end; i++) pages.push(i);
          
          if (current < total - 2) pages.push('...');
          pages.push(total);
        }
        app.proxy.page_numbers = pages;
      },

      changePage: (page) => {
        if (page < 1 || page > app.proxy.total_pages || page === '...') return;
        app.proxy.current_page = page;
        app.programs.applyPagination();
        // Opsional: Scroll ke atas tabel saat ganti halaman
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      prevPage: () => {
            // Aritmatika dilakukan di sini, bukan di template
            app.programs.changePage(app.proxy.current_page - 1);
        },

      nextPage: () => {
            app.programs.changePage(app.proxy.current_page + 1);
        },

      updateParentOptions: () => {
        app.proxy.parentOptions = app.proxy.categories.filter(c => c.parent_id === null);
      },

      // Universal updater
      updateProxy: (e, name) => {
        if (name.includes('.')) {
          const [parent, child] = name.split('.');
          app.proxy[parent][child] = e.target.value;
        } else {
          app.proxy[name] = e.target.value;
        }
        if (name === 'search_query') {
          app.programs.applyFilter();
        }
      },

      // Modal Actions
      openModal: () => {
        app.proxy.isEditing = false;
        app.proxy.editingId = null;
        app.proxy.form = { name: '', slug: '', parent_id: '' };
        app.proxy.isModalOpen = true;
      },
      editModal: (category) => {
        app.proxy.isEditing = true;
        app.proxy.editingId = category.id;
        app.proxy.form = { name: category.name, slug: category.slug, parent_id: category.parent_id || '' };
        app.proxy.isModalOpen = true;
      },
      closeModal: () => { app.proxy.isModalOpen = false; },

      saveCategory: (e) => {
        e.preventDefault();
        if (!app.proxy.form.name.trim()) return;

        if (app.proxy.isEditing) {
          const index = app.proxy.categories.findIndex(c => c.id === app.proxy.editingId);
          if (index !== -1) {
            app.proxy.categories[index].name = app.proxy.form.name;
            app.proxy.categories[index].slug = app.proxy.form.slug;
            app.proxy.categories[index].parent_id = app.proxy.form.parent_id ? Number(app.proxy.form.parent_id) : null;
            const parent = app.proxy.categories.find(p => p.id == app.proxy.form.parent_id && p.parent_id === null);
            app.proxy.categories[index].parent_name = parent ? parent.name : null;
          }
        } else {
          const newId = app.proxy.categories.length > 0 ? Math.max(...app.proxy.categories.map(c => c.id)) + 1 : 1;
          const parent = app.proxy.categories.find(p => p.id == app.proxy.form.parent_id && p.parent_id === null);
          app.proxy.categories.push({
            id: newId, name: app.proxy.form.name, slug: app.proxy.form.slug,
            parent_id: app.proxy.form.parent_id ? Number(app.proxy.form.parent_id) : null,
            parent_name: parent ? parent.name : null
          });
        }

        app.programs.closeModal();
        app.programs.updateParentOptions();
        app.programs.applyFilter(); // Refresh seluruh lapisan
      },

      deleteCategory: (id) => {
        if (confirm('Yakin ingin menghapus kategori ini?')) {
          app.proxy.categories = app.proxy.categories.filter(c => c.id !== id);
          app.programs.updateParentOptions();
          app.programs.applyFilter();
        }
      }
    };

    // ==========================================
    // INITIALIZATION & MOUNT
    // ==========================================
    const appEl = document.getElementById('app');
    const app = new HTMP('app', patterns.categories);

    app.setProxy(proxy);
    app.setProgram(programs);
    console.log(app);
    app.mount('app');   

    // 1. Load Initial Data dari JSON
    const initialData = JSON.parse(document.getElementById('initial-data').textContent);
    app.proxy.categories = initialData.categories;

    // 2. GENERATE MOCK DATA (Simulasi 55 kategori dari server)
    // Kita tambahkan data dummy agar pagination terlihat efeknya
    const newCategories = [];
    for (let i = 6; i <= 55; i++) {
      newCategories.push({
        id: i,
        name: `Kategori Dummy ${i}`,
        slug: `kategori-dummy-${i}`,
        parent_id: i % 5 === 0 ? 1 : null,
        parent_name: i % 5 === 0 ? 'Sepatu' : null
      });
    }

    // 2. Set ke Proxy SEKALI JALAN (Batch Update)
    // HTMP akan merender 60 baris ini dalam 1 proses saja (< 5ms)
    app.proxy.categories = [...app.proxy.categories, ...newCategories];    
    // 3. Inisiasi Lapisan Data
    app.programs.updateParentOptions();
    app.programs.applyFilter(); // Ini akan otomatis memanggil applyPagination & updatePageNumbers

    document.title = 'Kategori — TokoKu';    
  </script>
</body>
</html>
