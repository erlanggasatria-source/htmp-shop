<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tambah Produk — TokoKu</title>
  <link rel="stylesheet" href="./css/admin.css" />
  <style>
    /* Keyframe untuk smooth image loading */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .img-preview { animation: fadeIn 0.5s ease-in-out; }
  </style>
</head>
<body>

  <div id="app"></div>

  <script type="module">
    import { HTMP } from 'https://cdn.jsdelivr.net/npm/htm-projection@v1.2.2/+esm';

    // ==========================================
    // P1: PATTERN (Template)
    // ==========================================
    const adminLayout = (content) => `
      <div class="admin-layout">
        <header class="admin-topbar">
          <div class="topbar-left">
            <button class="sidebar-toggle" @click="toggleSidebar">&nbsp;≡&nbsp;</button>
            <div class="topbar-brand">
              <span class="topbar-logo">🛍️</span>
              <span class="topbar-title">TokoKu</span>
            </div>
          </div>
          <div class="topbar-right">
            <div class="topbar-user">
              <span class="topbar-user-name">Admin</span>
              <span class="topbar-user-role">Owner</span>
            </div>
          </div>
        </header>
        
        <!-- Sidebar dengan Class Merging v1.2.2 -->
        <aside class="admin-sidebar" :class="sidebarOpen ? 'is-open' : ''">
          <div class="sidebar-overlay" :class="sidebarOpen ? 'is-visible' : ''" @click="closeSidebar"></div>
          <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="sidebar-link" :class="currentPage === 'dashboard' ? 'is-active' : ''">📊 Dashboard</a>
            <a href="/admin/products" class="sidebar-link" :class="currentPage === 'products' ? 'is-active' : ''">📦 Produk</a>
            <a href="/admin/categories" class="sidebar-link" :class="currentPage === 'categories' ? 'is-active' : ''">🏷️ Kategori</a>
            <a href="/admin/orders" class="sidebar-link" :class="currentPage === 'orders' ? 'is-active' : ''">🛒 Order</a>
            <a href="/admin/logout" class="sidebar-link sidebar-link-danger">🚪Logout</a>
          </nav>
        </aside>

        <main class="admin-content">
          ${content}
        </main>
      </div>
    `;


    const patterns = {
      create: adminLayout(`
        <div class="content-header">
          <h1 class="content-title">Tambah Produk Baru</h1>
          <p class="content-subtitle">Lengkapi informasi dasar dan kelola varian produk</p>
        </div>

        <form @submit="submitForm">
          
          <!-- SECTION 1: INFORMASI DASAR -->
          <section class="card mb-3">
            <h2 class="card-title mb-2">Informasi Dasar</h2>
            
            <!-- Gunakan class="form-row" agar otomatis responsif (2 kolom di desktop, 1 kolom di mobile) -->
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Nama Produk <span class="text-danger">*</span></label>
                <input type="text" class="form-input" :value="form.name" @input="updateProxy(e, 'form.name')" placeholder="Contoh: Sepatu Sneakers Aero" required>
              </div>
              <div class="form-group">
                <label class="form-label">Kategori <span class="text-danger">*</span></label>
                <select class="form-select" :value="form.category_id" @change="updateProxy(e, 'form.category_id')" required>
                  <option value="">Pilih Kategori</option>
                  <option :for="cat in categories" :value="cat.id">{{ cat.name }}</option>
                </select>
              </div>
            </div>

            <div class="form-group" style="margin-top: 0.5rem;">
              <label class="form-label">Deskripsi</label>
              <textarea class="form-textarea" :value="form.description" @input="updateProxy(e, 'form.description')" rows="4" placeholder="Deskripsi detail produk..."></textarea>
            </div>
          </section>

          <!-- SECTION 2: MANAJEMEN VARIAN (DINAMIS) -->
          <section class="card mb-3">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
              <h2 class="card-title" style="margin:0;">Varian & Stok</h2>
              <button type="button" class="btn btn-sm btn-primary" @click="addVariant">➕ Tambah Varian</button>
            </div>
            
            <div class="table-wrapper">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Nama Varian (Warna/Ukuran)</th>
                    <th>SKU (Unik)</th>
                    <th>Selisih Harga (Rp)</th>
                    <th>Stok Awal</th>
                    <th style="width: 100px;">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Loop object utuh sesuai aturan HTMP -->
                  <tr :for="v in variants">
                    <td><input type="text" class="form-input" :value="v.name" @input="updateVariantField(e, v, 'name')" placeholder="Misal: Hitam 42" required></td>
                    <td><input type="text" class="form-input" :value="v.sku" @input="updateVariantField(e, v, 'sku')" placeholder="SKU-001" required></td>
                    <td><input type="number" class="form-input" :value="v.price_delta" @input="updateVariantField(e, v, 'price_delta')" placeholder="0" min="0"></td>
                    <td><input type="number" class="form-input" :value="v.stock" @input="updateVariantField(e, v, 'stock')" placeholder="0" min="0" required></td>
                    <td>
                      <button type="button" class="btn btn-sm btn-danger" @click="removeVariant(v)">Hapus</button>
                    </td>
                  </tr>
                  <!-- Empty state menggunakan :style -->
                  <tr>
                    <td colspan="5" style="text-align:center; padding:2rem; color:#6b7280;" :style="variants.length === 0 ? '' : 'display:none;'">
                      Belum ada varian. Klik tombol "Tambah Varian" untuk memulai.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <p class="text-muted" style="font-size:0.85rem; margin-top:0.5rem;">
              💡 Harga jual akhir = Harga Dasar (nanti) + Selisih Harga. Biarkan 0 jika harga sama.
            </p>
          </section>

          <!-- SECTION 3: AKSI -->
          <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
            <a href="/admin/products" class="btn btn-secondary">Batal</a>
            <button type="submit" class="btn btn-primary" :class="isSubmitting ? 'btn-secondary' : 'btn-primary'" :disabled="isSubmitting">
              <span>{{ isSubmitting ? 'Menyimpan...' : '💾 Simpan Produk' }}</span>
            </button>
          </div>

        </form>
      `)
    };

    // ==========================================
    // P2: PROXY (State & Helpers)
    // ==========================================
    const proxy = {
      currentPage: 'products',
      sidebarOpen: false,
      
      form: {
        name: '',
        category_id: '',
        description: ''
      },
      
      // Array dinamis untuk varian
      variants: [
        { name: '', sku: '', price_delta: 0, stock: 0 } // Default 1 baris kosong
      ],

      // Opsi kategori (Mock data)
      categories: [
        { id: 1, name: 'Sepatu' },
        { id: 2, name: 'Pakaian' },
        { id: 3, name: 'Aksesoris' },
        { id: 4, name: 'Tas' }
      ],

      isSubmitting: false
    };

    // ==========================================
    // P3: PROGRAM (Logic & State Mutation)
    // ==========================================
    const programs = {
      toggleSidebar: () => { app.proxy.sidebarOpen = !app.proxy.sidebarOpen; },
      closeSidebar: () => { app.proxy.sidebarOpen = false; },

      updateProxy: (e, name) => {
        if (name.includes('.')) {
          const [parent, child] = name.split('.');
          app.proxy[parent][child] = e.target.value;
        } else {
          app.proxy[name] = e.target.value;
        }
      },

      // --- LOGIC VARIAN DINAMIS ---
      addVariant: () => {
        app.proxy.variants.push({ name: '', sku: '', price_delta: 0, stock: 0 });
      },

      removeVariant: (v) => {
        // Mencari index object di array, lalu hapus
        const idx = app.proxy.variants.indexOf(v);
        if (idx > -1) {
          app.proxy.variants = app.proxy.variants.splice(idx, 1);
        }
      },

      updateVariantField: (e, v, field) => {
        let val = e.target.value;
        // Konversi ke angka untuk field numerik
        if (field === 'price_delta' || field === 'stock') {
          val = Number(val) || 0;
        }
        // Mutasi langsung pada object referensi (HTMP akan mendeteksi perubahan nested proxy)
        v[field] = val;
      },

      submitForm: (e) => {
        e.preventDefault();
        
        // Validasi sederhana
        if (!app.proxy.form.name || !app.proxy.form.category_id) {
          alert('Mohon lengkapi Nama Produk dan Kategori.');
          return;
        }
        if (app.proxy.variants.length === 0) {
          alert('Minimal harus ada 1 varian produk.');
          return;
        }

        app.proxy.isSubmitting = true;

        // Simulasi proses simpan ke server
        console.log('Payload yang akan dikirim ke server:', {
          product: app.proxy.form,
          variants: app.proxy.variants
        });

        setTimeout(() => {
          app.proxy.isSubmitting = false;
          alert('Produk berhasil disimpan! (Simulasi)');
          window.location.href = '/admin/products';
        }, 1000);
      }
    };

    // ==========================================
    // INITIALIZATION & MOUNT
    // ==========================================
    const app = new HTMP('app', patterns.create);
    app.setProxy(proxy);
    app.setProgram(programs);
    app.mount('app');

    document.title = 'Tambah Produk — TokoKu';
  </script>
</body>
</html>
